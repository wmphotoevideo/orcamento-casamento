<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orçamento Wanderson Miranda</title>
  <meta name="description" content="Sistema interativo de orçamento para fotografia e filmagem de casamentos por Wanderson Miranda.">
  <meta property="og:title" content="Orçamento Wanderson Miranda">
  <meta property="og:description" content="Sistema interativo de orçamento para fotografia e filmagem de casamentos por Wanderson Miranda.">
  <link rel="icon" type="image/png" href="/logo.png">
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
  <style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}

/* Layout: palco com a foto de capa de um lado (fixo no desktop, faixa no celular) e o orçamento em etapas do outro. */
:root{
  --bg:#F5F4F2; --surface:#FFFFFF; --ink:#1D1C1B; --muted:#67635E; --line:#DEDAD4;
  --accent:#7E5F34; --on-accent:#FFFFFF; --accent-soft:#EFE8DC; --on-ink:#F5F4F2; --danger:#A33A2B;
  --photo-ink:#FFFFFF; --photo-shade:rgba(15,12,10,.62);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --surface:#1D1B1A; --ink:#F1EEEA; --muted:#A8A39C; --line:#35322F;
    --accent:#CBA76E; --on-accent:#141312; --accent-soft:#2A241B; --on-ink:#141312; --danger:#E08A7A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1D1B1A; --ink:#F1EEEA; --muted:#A8A39C; --line:#35322F;
  --accent:#CBA76E; --on-accent:#141312; --accent-soft:#2A241B; --on-ink:#141312; --danger:#E08A7A;
  color-scheme:dark;
}
:root.hero{
  --bg:#0B0A09; --surface:#16130F; --ink:#F3EEE6; --muted:#B3AA9D; --line:#2E2922;
  --accent:#CBA76E; --on-accent:#141312; --accent-soft:#2A241B; --on-ink:#141312; --danger:#E08A7A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,dl,dd,fieldset{margin:0;padding:0}
fieldset{border:0;min-width:0}
ul{list-style:none}

.shell{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "main";min-height:100%}
@media (min-width:900px){
  .shell{grid-template-columns:minmax(300px,5fr) minmax(0,6fr);grid-template-rows:auto 1fr;grid-template-areas:"stage top" "stage main";min-height:100dvh}
  .stage{position:sticky;top:0;height:100dvh;align-self:start}
}

/* Cabeçalho */
.top{grid-area:top;background:#0B0A09;border-bottom:1px solid #2E2922;color:#F3EEE6;--ink:#F3EEE6;--accent:#CBA76E;--accent-soft:#2A241B;--line:#2E2922}
.top-in{width:min(100%,680px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand-logo{height:46px;width:auto;display:block;max-width:100%}
@media (max-width:400px){.brand-logo{height:40px}}
.menu-btn{display:inline-flex;align-items:center;gap:10px;background:none;border:1px solid var(--accent);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.9rem;letter-spacing:.04em}
.menu-btn:hover{background:var(--accent-soft)}
.burger{display:flex;flex-direction:column;gap:4px}
.burger i{display:block;width:16px;height:1.5px;background:var(--ink)}

/* Foto */
.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--line);height:clamp(210px,56vw,340px)}
@media (min-width:900px){.stage{height:100dvh}}
.stage img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;max-width:none}
@media (max-width:899px){.stage img{width:132%;object-position:0 56%}}
.stage::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to top,var(--photo-shade),transparent);pointer-events:none}
.stage-cap{position:absolute;z-index:1;left:max(24px,env(safe-area-inset-left,0px));bottom:26px;color:var(--photo-ink);display:flex;flex-direction:column;align-items:flex-start}
.stage-cap span{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase}
.stage-cap .cap-rule{width:48px;height:1px;background:#CBA76E;margin:14px 0 12px}
.stage-cap b{font-family:var(--f-display);font-weight:500;font-size:1.75rem;letter-spacing:.09em;text-transform:uppercase;line-height:1}
@media (min-width:900px){.stage-cap{left:48px;bottom:48px}.stage-cap b{font-size:2.6rem}}

/* Conteúdo */
.main{grid-area:main;display:flex;flex-direction:column;min-width:0;position:relative}
.wm-bg{position:absolute;right:0;bottom:0;width:min(46%,260px);height:auto;opacity:.07;pointer-events:none;z-index:0}
@media (prefers-reduced-motion:no-preference){.wm-bg{animation:wmin 1.6s ease .5s both}@keyframes wmin{from{opacity:0}to{opacity:.07}}}
.main-in{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:min(100%,680px);margin-inline:auto;padding-block:28px calc(var(--barh,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{flex:1;display:flex;flex-direction:column;min-width:0}
.prog{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.prog-label{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.segs i{height:2px;background:var(--line);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.segs i.on::after{transform:scaleX(1)}
h1,h2{font-family:var(--f-display);font-weight:500;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(2.2rem,5vw,3.1rem);line-height:1.05}
h2{font-size:clamp(1.9rem,4.4vw,2.5rem);line-height:1.08}
h1:focus,h2:focus{outline:none}
.lead{color:var(--muted);max-width:52ch;margin-top:12px}
.head{margin-bottom:24px}

/* Listas de escolha */
.list{display:flex;flex-direction:column;gap:12px}
.group-title{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.group-title:first-of-type{margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;transition:border-color .22s ease,box-shadow .22s ease,transform .22s cubic-bezier(.2,.8,.2,1)}
.card:has(input:checked:not(:disabled)){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(126,95,52,.12)}
:root[data-theme="dark"] .card:has(input:checked:not(:disabled)){box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(203,167,110,.16)}
.card.selected-pop{animation:selectPop .35s cubic-bezier(.2,1,.4,1.15) both}
@keyframes selectPop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
.opt,.row{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;cursor:pointer}
.opt input,.row input{position:absolute;opacity:0;width:1px;height:1px}
.dot,.box{width:20px;height:20px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:3px}
.dot{border-radius:50%}
.box{border-radius:5px}
input:checked+.dot{border-color:var(--accent)}
input:checked+.dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
input:checked+.box{background:var(--accent);border-color:var(--accent)}
input:checked+.box::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
input:focus-visible+.dot,input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:3px}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.line{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pkg-name{font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.1}
.price{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.sub{color:var(--muted);font-size:.92rem}
.tag{align-self:flex-start;margin-top:6px;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:999px}
.more{border-top:1px solid var(--line);background:rgba(126,95,52,.05);border-bottom-left-radius:9px;border-bottom-right-radius:9px;transition:background-color .2s ease}
:root[data-theme="dark"] .more{background:rgba(203,167,110,.08)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .more{background:rgba(203,167,110,.08)}
}
.more:hover{background:rgba(126,95,52,.09)}
:root[data-theme="dark"] .more:hover{background:rgba(203,167,110,.14)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .more:hover{background:rgba(203,167,110,.14)}
}
.more summary{cursor:pointer;list-style:none;font-size:.85rem;color:var(--ink);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:500;letter-spacing:.01em}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-size:1.25rem;line-height:1;color:var(--accent);font-weight:600;display:inline-block;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.more[open] summary::after{content:"+";transform:rotate(45deg);color:var(--accent)}
.more ul{padding:4px 18px 16px;display:grid;gap:6px;font-size:.92rem}
.more li{display:flex;gap:10px}
.more li::before{content:"";width:5px;height:5px;background:var(--accent);border-radius:50%;margin-top:.55em;flex:none}

.row-name{font-weight:500}
.row-desc{color:var(--muted);font-size:.88rem}
.row .price{padding-top:1px}
.row.inc{cursor:default;background:rgba(203,167,110,.05);border-radius:9px}
.row.inc .box{opacity:.65;border-color:var(--accent);background:var(--accent)}
.row.inc .price{color:var(--accent);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.note{font-size:.88rem;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:12px}

/* Formulário */
.form{display:grid;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%;min-width:0}
.field textarea{min-height:104px;resize:vertical}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.err{color:var(--danger);font-size:.85rem}

/* Resumo */
.sum{display:grid;gap:0}
.sum-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.sum-row dt{color:var(--muted)}
.sum-row dd{text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.sum-row.big dt{font-family:var(--f-display);font-weight:600;font-size:1.6rem;color:var(--ink)}
.sum-row.big dd{font-family:var(--f-body);font-weight:500;font-size:1.45rem;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.sum-block{margin-top:26px}
.sum-block h3{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:400;margin-bottom:4px}
.pay-name{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.15}
.pay-note{margin-top:14px;font-size:.88rem;color:var(--muted)}
.pay{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:8px;font-size:.92rem}
.pay strong{font-weight:500}
.pay p+p{color:var(--muted)}
.side{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.link-btn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.92rem}
.msg{margin-top:16px}
.msg summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.msg textarea{width:100%;min-height:200px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.9rem}

/* Barra de ações */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){.bar{left:calc(100% * 5 / 11)}}
.bar-in{width:min(100%,680px);margin-inline:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .btn{padding:10px 20px;font-size:.9rem;min-width:0}
.tot{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.2;min-width:0}
.tot span{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tot strong{font-family:var(--f-body);font-weight:500;font-size:1.15rem;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.tot strong.none{font-weight:400;font-size:.8rem;color:var(--muted);white-space:normal;line-height:1.2}
.bar-in.last .tot{grid-column:2/4;align-items:flex-end;text-align:right}
.bar .btn.send{grid-column:1/-1;width:100%;padding:13px 20px;border:0;color:#1A140C;
  background:linear-gradient(135deg,#F6E7C1 0%,#E3C98F 48%,#CDAA6E 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.bar .btn.send:hover{filter:brightness(1.05)}
.btn{border-radius:999px;padding:12px 24px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer;font-weight:500;letter-spacing:.03em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}

/* Menu */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{width:min(100%,680px);margin-inline:auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.nav{display:flex;flex-direction:column}
.nav button{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:18px 0;cursor:pointer;
  font-family:var(--f-display);font-weight:500;font-size:2rem;display:flex;justify-content:space-between;align-items:baseline}
.nav button span{font-family:var(--f-body);font-size:.85rem;color:var(--muted)}
.nav button:hover{color:var(--accent)}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--accent);font-size:1.2rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);margin-top:10px}
.contact{display:grid;gap:18px}
.contact div{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);padding-bottom:16px}
.contact small{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.contact a{color:var(--accent)}
.contact .val{user-select:all;overflow-wrap:anywhere}

.welcome{margin-block:0 auto;padding-top:34px;display:flex;flex-direction:column;align-items:flex-start;width:100%}
@media (min-width:900px){.welcome{margin-block:auto;padding-top:0}}
.eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.welcome .eyebrow{display:flex;align-items:center;gap:18px;width:100%}
.welcome .eyebrow::after{content:"";flex:1;height:1px;background:var(--accent);opacity:.7}
.welcome h1{font-size:clamp(1.9rem,6.4vw,2.7rem);line-height:1.12;margin-top:22px;max-width:none;font-weight:500}
.welcome .lead{font-size:.95rem;line-height:1.7;margin-top:22px;max-width:34ch}
.btn.cta{margin-top:34px;max-width:100%;padding:17px 28px;font-size:.92rem;letter-spacing:.06em;gap:16px;
  background:linear-gradient(135deg,#F6E7C1 0%,#E3C98F 48%,#CDAA6E 100%);color:#1A140C;border:0;
  box-shadow:0 10px 28px rgba(203,167,110,.22),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.cta:hover{filter:brightness(1.06)}
.cta svg{width:26px;height:26px;flex:none}
.cta .sep{width:1px;height:26px;background:rgba(26,20,12,.35);flex:none}
.cta .arr{display:inline-block;width:20px;height:1.5px;background:currentColor;position:relative;flex:none}
.cta .arr::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border:solid currentColor;border-width:1.5px 1.5px 0 0;transform:rotate(45deg)}
@media (max-width:400px){.btn.cta{padding:16px 20px;gap:12px;font-size:.86rem;letter-spacing:.04em}}

@media (prefers-reduced-motion:no-preference){
  .card,.btn,.dot,.box,.menu-btn{transition:border-color .2s,box-shadow .2s,background-color .2s,opacity .2s,transform .2s}
  .btn:not([disabled]):hover{transform:translateY(-1px)}
  .btn:not([disabled]):active{transform:scale(.99)}
  .cta .arr{transition:width .25s ease}
  .cta:hover .arr{width:30px}
  .card:hover{border-color:var(--muted)}
  #view>*{animation:in .5s cubic-bezier(.2,.7,.2,1) both}
  #view>*:nth-child(2){animation-delay:.05s}
  #view>*:nth-child(3){animation-delay:.1s}
  #view>*:nth-child(4){animation-delay:.15s}
  #view>.welcome,#view>.list{animation:none}
  .list>.card{animation:in .5s cubic-bezier(.2,.7,.2,1) both}
  .list>.card:nth-child(1){animation-delay:.08s}
  .list>.card:nth-child(2){animation-delay:.13s}
  .list>.card:nth-child(3){animation-delay:.18s}
  .list>.card:nth-child(4){animation-delay:.23s}
  .list>.card:nth-child(5){animation-delay:.28s}
  .list>.card:nth-child(6){animation-delay:.33s}
  .list>.card:nth-child(7){animation-delay:.38s}
  .welcome>*{animation:in .85s cubic-bezier(.2,.7,.2,1) both}
  .welcome>*:nth-child(2){animation-delay:.12s}
  .welcome>*:nth-child(3){animation-delay:.24s}
  .welcome>*:nth-child(4){animation-delay:.36s}
  .welcome>*:nth-child(5){animation-delay:.5s}
  .stage img{animation:settle 1.9s cubic-bezier(.2,.6,.2,1) both}
  .segs i.cur::after{animation:fill .7s cubic-bezier(.2,.7,.2,1) both}
  input:checked+.box,input:checked+.dot{animation:bump .32s ease}
  input:checked+.dot::after{animation:grow .26s cubic-bezier(.3,1.6,.5,1) both}
  .err:not([hidden]){animation:in .25s ease both}
  .more[open] ul{animation:in .3s ease both}
  .sheet:not([hidden]){animation:sheetin .3s ease both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes settle{from{transform:scale(1.07);opacity:.85}to{transform:none;opacity:1}}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes grow{from{transform:scale(.2)}to{transform:scale(1)}}
  @keyframes sheetin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .tot strong.bump{animation:totbump .38s cubic-bezier(.2,.8,.2,1)}
  @keyframes totbump{0%{transform:scale(1)}40%{transform:scale(1.09);color:var(--accent)}100%{transform:scale(1)}}
  .pkg-list>.card{animation:pkgCardIn .65s cubic-bezier(.16,1,.3,1) both}
  .pkg-list>.card:nth-of-type(1){animation-delay:.06s}
  .pkg-list>.card:nth-of-type(2){animation-delay:.12s}
  .pkg-list>.card:nth-of-type(3){animation-delay:.18s}
  .pkg-list>.card:nth-of-type(4){animation-delay:.24s}
  .pkg-list>.card:nth-of-type(5){animation-delay:.30s}
  @keyframes pkgCardIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
}

/* Toast feedback */
.toast{position:fixed;left:50%;bottom:calc(var(--barh,0px) + 16px);transform:translate(-50%,14px) scale(.95);

  white-space:nowrap;max-width:min(90vw,480px)}
@media (min-width:900px){.toast{left:calc(100% * 5 / 11 + (100% * 6 / 11) / 2)}}

.calc-val strong{font-size:1.55rem;font-weight:600;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.calc-val strong.bump{animation:calcpop .3s ease-out}
@keyframes calcpop{0%{transform:scale(1)}40%{transform:scale(1.08);color:var(--accent)}100%{transform:scale(1)}}
.calc-val span{font-size:.85rem;color:var(--muted)}
.calc-stepper{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.calc-btn{width:28px;height:28px;border-radius:50%;background:transparent;border:0;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:1.15rem;font-weight:600;line-height:1;transition:background-color .15s}
.calc-btn:hover:not(:disabled){background:var(--line);color:var(--ink)}
.calc-btn:disabled{opacity:.25;cursor:not-allowed}
.calc-num{min-width:32px;text-align:center;font-weight:600;font-size:.9rem}
.calc-slider-wrap{display:flex;flex-direction:column;gap:6px}
.calc-slider{width:100%;height:6px;border-radius:3px;background:var(--line);outline:none;-webkit-appearance:none;cursor:pointer}
.calc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2.5px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .15s ease}
.calc-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.calc-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2.5px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.calc-range-labels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);letter-spacing:.02em}

.calc-pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .15s ease}
.calc-pill:hover{border-color:var(--accent);color:var(--accent)}
.calc-pill.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.calc-breakdown{font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:3px}

  function addMonths(d,k){ var mo=d.getMonth()+k, last=new Date(d.getFullYear(),mo+1,0).getDate(); return new Date(d.getFullYear(),mo,Math.min(d.getDate(),last)); }
  function dstr(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
  function payPlan(){
    var tC=Math.round(total()*100), resC=Math.min(RESERVA_C,tC), remC=tC-resC;
    var avC=Math.round(tC*(1-DESC_AVISTA));
    var cap=Math.max(1,Math.floor(remC/MIN_PARC_C));
    var maxMonths=cap;
    var pl={tC:tC,resC:resC,remC:remC,avC:avC,saveC:tC-avC,n:1,maxN:1,baseC:remC,lastC:remC,dl:null,close:false};
    var ev=parseDate(S.f.date);
    if(ev){
      var dl=new Date(ev.getFullYear(),ev.getMonth(),ev.getDate()-DIAS_ANTES);
      var today=new Date(); today.setHours(0,0,0,0);
      pl.dl=dl;
      if(dl<=today){
        pl.close=true;
        pl.maxN=1;
        pl.n=1;
        pl.baseC=remC;
        pl.lastC=remC;
        return pl;
      }
      var k=0; while(k<60 && addMonths(today,k+1)<=dl) k++;
      maxMonths=k>0 ? Math.min(k,cap) : 1;
    }
    pl.maxN=Math.max(1, maxMonths);
    if(typeof S.customN==='number' && S.customN>=1 && S.customN<=pl.maxN){
      pl.n=S.customN;
    } else {
      pl.n=pl.maxN;
      S.customN=pl.n;
    }
    pl.baseC=Math.floor(remC/pl.n);
    pl.lastC=remC-pl.baseC*(pl.n-1);
    return pl;
  }

  var shown=0, raf=0;
  function paintTotal(){
    var el=$('#totVal'); if(!el) return;
    cancelAnimationFrame(raf);
    if(!pkgObj()){ el.className='none'; el.textContent='Escolha um pacote'; shown=0; return; }
    el.className='';
    var to=total(), from=shown; shown=to;
    var reduce=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce || from===to){ el.textContent=fmt(to); return; }
    if(!reduce && from>0){
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
    var t0=null, dur=420;
    function tick(ts){
      if(t0===null) t0=ts;
      var k=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent = k<1 ? BRL0.format(Math.round(from+(to-from)*e)) : fmt(to);
      if(k<1) raf=requestAnimationFrame(tick);
    }
    raf=requestAnimationFrame(tick);
  }

  function saveLeadOnReview(){
    try {
      if(!S.leadId){
        S.leadId = 'lead_' + Date.now() + '_' + Math.random().toString(36).substr(2,7);
      }
      var p = pkgObj();
      if(!p){
        p = PKGS[0] || { id: 'luz', name: 'Luz', price: 1000, short: 'Fotografia' };
      }
      var ex = paid();
      var t = total();
      var pl = payPlan();
      var msgText = '';
      try { msgText = buildMsg(); } catch(e){}

      var leadData = {
        id: S.leadId,
        clientName: (S.f.name || '').trim() || 'Noivos',
        date: S.f.date || '',
        time: S.f.time || '',
        place: S.f.place || '',
        notes: S.f.notes || '',
        pkg: {
          id: p.id,
          name: p.name,
          price: p.price,
          short: p.short || '',
          album: p.album || null
        },
        extras: ex.map(function(e){
          return { id: e.id, name: e.name, price: e.price, g: e.g };
        }),
        total: t,
        pay: {
          method: S.pay,
          text: payLine(),
          reserva: pl.resC / 100,
          installments: pl.n,
          monthly: pl.baseC / 100,
          lastMonthly: pl.lastC / 100,
          deadline: pl.dl ? dstr(pl.dl) : ''
        },
        status: 'Revisado',
        waSent: false,
        message: msgText,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      // 1. Salvar no localStorage (imediato e garantido)
      try {
        var localLeads = JSON.parse(localStorage.getItem('wm_client_leads') || '[]');
        if(!Array.isArray(localLeads)) localLeads = [];
        var exIdx = localLeads.findIndex(function(l){ return l.id === leadData.id; });
        if(exIdx >= 0){
          leadData.createdAt = localLeads[exIdx].createdAt || leadData.createdAt;
          localLeads[exIdx] = leadData;
        } else {
          localLeads.unshift(leadData);
        }
        localStorage.setItem('wm_client_leads', JSON.stringify(localLeads));
      } catch(err){ console.warn('Erro ao salvar lead no localStorage:', err); }

      // 2. Salvar na API do servidor
      fetch('/api/leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(leadData)
      }).catch(function(e){ console.warn('Erro ao salvar lead na API:', e); });

    } catch(err){
      console.error('Erro em saveLeadOnReview:', err);
    }
  }

  function loadConfig(){
    // 1. Carregamento síncrono imediato do cache local para refletir na página inicial
    try {
      var cached = localStorage.getItem('wm_catalog_config');
      if(cached){
        var parsed = JSON.parse(cached);
        if(parsed && Array.isArray(parsed.packages) && parsed.packages.length > 0){
          PKGS = parsed.packages;
        }
        if(parsed && Array.isArray(parsed.extras) && parsed.extras.length > 0){
          EXTRAS = parsed.extras;
          ALBUMS3 = EXTRAS.filter(function(e){ return e.g==='album'; }).map(function(e){ return e.id; });
        }
      }
    } catch(e){}

    // 2. Sincronização com o servidor
    fetch('/api/config')
      .then(function(r){ return r.json(); })
      .then(function(cfg){
        var changed = false;
        if(cfg && Array.isArray(cfg.packages) && cfg.packages.length > 0){
          PKGS = cfg.packages;
          changed = true;
          try {
            var curr = JSON.parse(localStorage.getItem('wm_catalog_config') || '{}');
            curr.packages = PKGS;
            localStorage.setItem('wm_catalog_config', JSON.stringify(curr));
          } catch(e){}
        } else {
          // Se o servidor ainda não tem pacotes salvos, mas o localStorage tem, sincroniza com o servidor
          try {
            var localCfg = localStorage.getItem('wm_catalog_config');
            if(localCfg){
              var pCfg = JSON.parse(localCfg);
              if(pCfg && Array.isArray(pCfg.packages) && pCfg.packages.length > 0){
                fetch('/api/config', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ packages: pCfg.packages, extras: pCfg.extras || EXTRAS })
                }).catch(function(){});
              }
            }
          } catch(e){}
        }

        if(cfg && Array.isArray(cfg.extras) && cfg.extras.length > 0){
          EXTRAS = cfg.extras;
          ALBUMS3 = EXTRAS.filter(function(e){ return e.g==='album'; }).map(function(e){ return e.id; });
          changed = true;
          try {
            var currEx = JSON.parse(localStorage.getItem('wm_catalog_config') || '{}');
            currEx.extras = EXTRAS;
            localStorage.setItem('wm_catalog_config', JSON.stringify(currEx));
          } catch(e){}
        }

        if(changed){
          render(false);
        }
      })
      .catch(function(){});
  }

  function fmtRelTime(iso){
    if(!iso) return '';
    try{
      var d = new Date(iso);
      var now = new Date();
      var diffSec = Math.floor((now - d) / 1000);
      if(diffSec < 60) return 'Agora mesmo';
      if(diffSec < 3600) return Math.floor(diffSec/60) + ' min atrás';
      var day = String(d.getDate()).padStart(2,'0');
      var mo = String(d.getMonth()+1).padStart(2,'0');
      var yr = d.getFullYear();
      var hr = String(d.getHours()).padStart(2,'0');
      var mi = String(d.getMinutes()).padStart(2,'0');
      if(diffSec < 86400) return 'Hoje às ' + hr + ':' + mi;
      return day + '/' + mo + '/' + yr + ' às ' + hr + ':' + mi;
    }catch(e){ return iso; }
  }

  function fetchLeads(cb){
    ADM.loading = true;
    var localList = [];
    try {
      localList = JSON.parse(localStorage.getItem('wm_client_leads') || '[]');
      if(!Array.isArray(localList)) localList = [];
    } catch(e){ localList = []; }

    fetch('/api/leads')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var serverList = Array.isArray(data) ? data : [];
        var map = {};
        serverList.forEach(function(l){ if(l && l.id) map[l.id] = l; });
        localList.forEach(function(l){
          if(l && l.id){
            if(!map[l.id]){
              map[l.id] = l;
              fetch('/api/leads', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(l)
              }).catch(function(){});
            } else if(l.waSent && !map[l.id].waSent){
              map[l.id] = l;
            }
          }
        });
        var merged = Object.values(map);
        merged.sort(function(a,b){
          var da = new Date(b.createdAt || b.updatedAt || 0).getTime();
          var db = new Date(a.createdAt || a.updatedAt || 0).getTime();
          return da - db;
        });
        ADM.leads = merged;
        try { localStorage.setItem('wm_client_leads', JSON.stringify(merged)); } catch(e){}
        ADM.loading = false;
        if(cb) cb();
      })
      .catch(function(err){
        console.warn('Usando dados de clientes salvos localmente:', err);
        ADM.leads = localList;
        ADM.loading = false;
        if(cb) cb();
      });
  }

  /* In-App Confirmation Modal (substitui window.confirm e window.alert para compatibilidade total em iframes) */
  var pendingConfirmAction = null;
  function showConfirmModal(opts){
    opts = opts || {};
    var modal = $('#appConfirmModal');
    if(!modal){
      if(typeof opts.onConfirm === 'function') opts.onConfirm();
      return;
    }
    var titleEl = $('#appConfirmTitle');
    var msgEl = $('#appConfirmMsg');
    var actBtn = $('#appConfirmAction');
    var cancelBtn = $('#appConfirmCancel');
    var iconEl = $('#appConfirmIcon');

    if(titleEl) titleEl.textContent = opts.title || 'Confirmação';
    if(msgEl) msgEl.innerHTML = opts.message || 'Deseja confirmar esta ação?';
    if(actBtn){
      actBtn.textContent = opts.confirmText || 'Confirmar';
      actBtn.className = 'app-confirm-btn ' + (opts.confirmClass || 'danger');
    }
    if(cancelBtn){
      cancelBtn.textContent = opts.cancelText || 'Cancelar';
    }
    if(iconEl){
      if(opts.iconType === 'warning'){
        iconEl.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
        iconEl.style.color = '#d35400';
        iconEl.style.background = 'rgba(211,84,0,0.12)';
      } else {
        iconEl.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        iconEl.style.color = '#c0392b';
        iconEl.style.background = 'rgba(192,57,43,0.12)';
      }
    }

    pendingConfirmAction = typeof opts.onConfirm === 'function' ? opts.onConfirm : null;
    modal.style.display = 'flex';
    modal.setAttribute('aria-hidden', 'false');
    if(actBtn) setTimeout(function(){ actBtn.focus(); }, 40);
  }

  function triggerCardPop(card){

  function syncParcUI(){
    var pl=payPlan();
    var cm=$('#calcMonthly');
    if(cm){
      cm.textContent=cf(pl.baseC);
      cm.classList.remove('bump');
      void cm.offsetWidth;
      cm.classList.add('bump');
    }
    var cmo=$('#calcMonths'); if(cmo) cmo.textContent=pl.n+'x';
    var cn=$('#calcNum'); if(cn) cn.textContent=pl.n+'x';
    var cr=$('#parcRange'); if(cr) cr.value=pl.n;
    var psub=$('#parcSub'); if(psub) psub.textContent=parcText(pl);
    var mb=$('#msgbox'); if(mb) mb.value=buildMsg();
    var wa=$('#waBtn'); if(wa) wa.href='https://wa.me/'+WA+'?text='+encodeURIComponent(buildMsg());
    var bDown=document.querySelector('[data-calc="-1"]'); if(bDown) bDown.disabled=(pl.n<=1);
    var bUp=document.querySelector('[data-calc="1"]'); if(bUp) bUp.disabled=(pl.n>=pl.maxN);
    var pills=document.querySelectorAll('[data-set-n]');
    pills.forEach(function(p){ p.classList.toggle('on',parseInt(p.dataset.setN,10)===pl.n); });
    var bd=$('#calcBreakdown');
    if(bd){
      bd.innerHTML='<span>Entrada para reserva da data: <strong>'+cf(pl.resC)+'</strong></span>'+
        '<span>Restante: <strong>'+pl.n+'x de '+cf(pl.baseC)+'</strong>'+(pl.lastC!==pl.baseC?' (última de '+cf(pl.lastC)+')':'')+(pl.dl?' até '+dstr(pl.dl):'')+'</span>'+
        '<span style="font-size:.74rem;color:var(--muted)">Regra de no mínimo R$ 300 por parcela respeitada.</span>';
    }
    updateLeadCurrentState();
  }

  $('#view').addEventListener('change',function(e){
    var t=e.target;
    if(t.name==='pay'){
      S.pay=t.value;
      var mb2=$('#msgbox'); if(mb2) mb2.value=buildMsg();
      var wa=$('#waBtn'); if(wa) wa.href='https://wa.me/'+WA+'?text='+encodeURIComponent(buildMsg());
      updateLeadCurrentState();
      render(false);
      return;

    if(t.name==='pkg'){
      S.pkg=t.value;
      pkgObj().inc.forEach(function(i){ S.ex.delete(i); });
      triggerCardPop(t.closest('.card'));
      var p=pkgObj();
      showToast('Pacote '+p.name+' selecionado · Total '+fmt(total()));
      updateBar();
    }
    else if(t.dataset && t.dataset.ex){
      var exObj=EXTRAS.find(function(x){ return x.id===t.value; });
      var exName=exObj?exObj.name:'Item';
      if(t.checked){
        S.ex.add(t.value);
        if(ALBUMS3.indexOf(t.value)>-1) ALBUMS3.forEach(function(a){
          if(a!==t.value){ S.ex.delete(a); var o=document.querySelector('input[data-ex][value="'+a+'"]'); if(o) o.checked=false; }
        });
        triggerCardPop(t.closest('.card'));
        showToast(exName+' adicionado · Total '+fmt(total()));
      } else {
        S.ex.delete(t.value);
        showToast(exName+' removido · Total '+fmt(total()));
      }
      updateBar();
    }
  });
  $('#view').addEventListener('input',function(e){

      syncParcUI();
      return;
    }
    var m={'f-name':'name','f-date':'date','f-time':'time','f-place':'place','f-notes':'notes'}[e.target.id];
    if(!m) return;

      var pl=payPlan();
      S.customN=Math.max(1,Math.min(pl.maxN,pl.n+delta));

  function copyMsg(){
    var msg=buildMsg(), note=$('#copied');
    function fallback(){ var d=$('#msgd'); if(d) d.open=true; var t=$('#msgbox'); if(t){ t.value=msg; t.focus(); t.select(); } if(note) note.textContent='Selecionei o texto. Copie e cole no WhatsApp.'; }
    try{
      navigator.clipboard.writeText(msg).then(function(){
        if(note) note.textContent='Mensagem copiada com sucesso!';
        showToast('Mensagem copiada para a área de transferência!');
        setTimeout(function(){ if(note) note.textContent=''; }, 4000);
      },fallback);
    }catch(err){ fallback(); }
  }

      if(container){
        var sentCount = ADM.leads.filter(function(l){ return l.waSent; }).length;
        var reviewCount = ADM.leads.filter(function(l){ return !l.waSent; }).length;
        var filteredLeads = ADM.leads.filter(function(l){
          if(ADM.filter === 'wa' && !l.waSent) return false;
          if(ADM.filter === 'review' && l.waSent) return false;
          if(ADM.search.trim()){
            var q = ADM.search.toLowerCase();
            var matchName = (l.clientName || '').toLowerCase().indexOf(q) > -1;
            var matchDate = (l.date || '').toLowerCase().indexOf(q) > -1;
            var matchPlace = (l.place || '').toLowerCase().indexOf(q) > -1;
            var matchPkg = (l.pkg && l.pkg.name ? l.pkg.name : '').toLowerCase().indexOf(q) > -1;
            if(!matchName && !matchDate && !matchPlace && !matchPkg) return false;
          }
          return true;
        });
        container.innerHTML = filteredLeads.length === 0 ? '<p class="lead" style="text-align:center;padding:32px 0;color:var(--muted)">Nenhum orçamento encontrado.</p>' :
        filteredLeads.map(function(lead){
          var isExp = ADM.expandedId === lead.id;
          var waMsgUrl = 'https://wa.me/?text=' + encodeURIComponent('Olá, ' + (lead.clientName || 'noivos') + '! Aqui é o Wanderson Miranda. Vi suas escolhas de orçamento para o casamento em ' + (fmtDate(lead.date) || 'sua data') + '. Gostaria de tirar alguma dúvida ou reservar a data?');
          var paySummary = '';
          if(lead.pay){
            if(lead.pay.method === 'avista') paySummary = 'À vista (5% desc)';
            else if(lead.pay.method === 'cartao') paySummary = 'Cartão de crédito';
            else paySummary = (lead.pay.installments || 1) + 'x mensais de ' + fmt(lead.pay.monthly || 0);
          }
          var extrasList = (lead.extras && lead.extras.length) ? lead.extras.map(function(e){ return '• ' + e.name + ' (' + fmt(e.price) + ')'; }).join('<br>') : 'Nenhum adicional selecionado';

          return '<div class="adm-lead-card">'+
            '<div class="adm-lead-top">'+
              '<div class="adm-lead-name">👰🤵 '+esc(lead.clientName || 'Noivos')+'</div>'+
              (lead.waSent ?
                '<span class="adm-status-tag sent">🟢 Enviou WhatsApp</span>' :
                '<span class="adm-status-tag review" title="Salvo automaticamente quando o cliente clicou em Revisar">🟡 Parou na Revisão</span>')+
            '</div>'+
            '<div class="adm-lead-grid">'+
              '<div><span>Data do Casamento</span><strong>'+(fmtDate(lead.date) || 'A definir')+(lead.time ? ' às '+esc(lead.time) : '')+'</strong></div>'+
              '<div><span>Local</span><strong>'+esc(lead.place || 'Não informado')+'</strong></div>'+
              '<div><span>Pacote Base</span><strong>'+esc(lead.pkg ? lead.pkg.name : '-')+' ('+fmt(lead.pkg ? lead.pkg.price : 0)+')</strong></div>'+
              '<div><span>Investimento Total</span><strong style="color:var(--accent);font-size:1.05rem">'+fmt(lead.total || 0)+'</strong></div>'+
              '<div><span>Pagamento</span><strong>'+esc(paySummary)+'</strong></div>'+
              '<div><span>Salvo em</span><span style="color:var(--muted);font-size:.78rem;text-transform:none;letter-spacing:0">'+fmtRelTime(lead.createdAt || lead.updatedAt)+'</span></div>'+
            '</div>'+
            (isExp ?
              '<div class="adm-lead-details">'+
                '<div><strong style="color:var(--ink)">Extras & Álbuns:</strong><div style="margin-top:4px;color:var(--muted)">'+extrasList+'</div></div>'+
                (lead.notes ? '<div><strong style="color:var(--ink)">Observações dos noivos:</strong><p style="margin:4px 0 0;color:var(--muted)">'+esc(lead.notes)+'</p></div>' : '')+
                (lead.pay && lead.pay.text ? '<div><strong style="color:var(--ink)">Condições de Pagamento:</strong><p style="margin:4px 0 0;color:var(--muted)">'+esc(lead.pay.text.replace(/\*/g,''))+'</p></div>' : '')+
                '<div><strong style="color:var(--ink)">Texto Completo da Proposta:</strong>'+
                  '<textarea readonly style="width:100%;font-size:.78rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:90px;margin-top:4px">'+esc(lead.message || '')+'</textarea>'+
                '</div>'+
              '</div>' : '')+
            '<div class="adm-lead-actions">'+
              '<button type="button" class="adm-btn-sm" data-adm-toggle="'+lead.id+'">'+(isExp ? '▲ Menos detalhes' : '▼ Ver detalhes')+'</button>'+
              '<a class="adm-btn-sm primary" href="'+waMsgUrl+'" target="_blank" rel="noopener">Abrir WhatsApp</a>'+
              '<button type="button" class="adm-btn-sm" data-adm-copy="'+lead.id+'">Copiar Proposta</button>'+
              '<button type="button" class="adm-btn-sm danger" data-adm-del="'+lead.id+'">Excluir</button>'+
            '</div>'+
          '</div>';
        }).join('');
      }
    }
  });

  sheet.addEventListener('click',function(e){
    var b=e.target.closest('[data-s]');
    if(b){
      var a=b.dataset.s;
      if(a==='close') closeSheet();
      else if(a==='home'){ closeSheet(); if(S.step!==-1) go(-1); }
      else if(a==='admin'){
        if(isAdminAuth()){
          fetchLeads(function(){ openSheet('admin'); });
        } else {
          openSheet('admin');
        }
      }
      else openSheet(a);
      return;
    }

    /* Admin Tab switcher */
    var tbtn = e.target.closest('[data-adm-tab]');
    if(tbtn){
      syncEditingPkgsFromDom();
      ADM.tab = tbtn.dataset.admTab;
      if(ADM.tab === 'leads'){
        fetchLeads(function(){ openSheet('admin'); });
      } else {
        ADM.editingPkgs = JSON.parse(JSON.stringify(PKGS));
        ADM.editingExtras = JSON.parse(JSON.stringify(EXTRAS));
        openSheet('admin');
      }
      return;
    }

    /* Admin Filter pills */
    var fbtn = e.target.closest('[data-adm-filter]');
    if(fbtn){
      ADM.filter = fbtn.dataset.admFilter;
      openSheet('admin');
      return;
    }

    /* Admin Refresh */
    if(e.target.closest('[data-adm-act="refresh-leads"]')){
      fetchLeads(function(){
        showToast('Lista de orçamentos atualizada.');
        openSheet('admin');
      });
      return;
    }

    /* Admin Logout */
    if(e.target.closest('[data-adm-act="logout"]')){
      setAdminAuth(false);
      showToast('Sessão encerrada.');
      openSheet('menu');
      return;
    }

    /* Admin Toggle details */
    var togBtn = e.target.closest('[data-adm-toggle]');
    if(togBtn){
      var id = togBtn.dataset.admToggle;
      ADM.expandedId = ADM.expandedId === id ? null : id;
      openSheet('admin');
      return;
    }

    /* Admin Copy lead proposal */
    var cpBtn = e.target.closest('[data-adm-copy]');
    if(cpBtn){
      var leadId = cpBtn.dataset.admCopy;
      var found = ADM.leads.find(function(l){ return l.id === leadId; });
      if(found && found.message){
        navigator.clipboard.writeText(found.message).then(function(){
          showToast('Proposta copiada com sucesso!');
        });
      }
      return;
    }

    /* Admin Move Package with arrows */
    var movePkgBtn = e.target.closest('[data-adm-move-pkg]');
    if(movePkgBtn){
      syncEditingPkgsFromDom();
      var pIdx = parseInt(movePkgBtn.dataset.pkgIdx, 10);
      var dir = movePkgBtn.dataset.admMovePkg;
      var targetIdx = dir === 'up' ? pIdx - 1 : pIdx + 1;
      if(targetIdx >= 0 && targetIdx < ADM.editingPkgs.length){
        var item = ADM.editingPkgs.splice(pIdx, 1)[0];
        ADM.editingPkgs.splice(targetIdx, 0, item);
        openSheet('admin', { preserveScroll: true });
        showToast('Pacote movido para ' + (dir === 'up' ? 'cima' : 'baixo') + '!');
      }
      return;
    }

    /* Admin Move Extra with arrows */
    var moveExBtn = e.target.closest('[data-adm-move-ex]');
    if(moveExBtn){
      syncEditingPkgsFromDom();
      var eIdx = parseInt(moveExBtn.dataset.exIdx, 10);
      var dir = moveExBtn.dataset.admMoveEx;
      var grp = moveExBtn.dataset.exGroup;
      var indices = [];
      ADM.editingExtras.forEach(function(x, i){ if(x.g === grp) indices.push(i); });
      var pos = indices.indexOf(eIdx);
      var targetPos = dir === 'up' ? pos - 1 : pos + 1;
      if(targetPos >= 0 && targetPos < indices.length){
        var targetIdx = indices[targetPos];
        var item = ADM.editingExtras[eIdx];
        ADM.editingExtras[eIdx] = ADM.editingExtras[targetIdx];
        ADM.editingExtras[targetIdx] = item;
        openSheet('admin', { preserveScroll: true });
        showToast('Item movido para ' + (dir === 'up' ? 'cima' : 'baixo') + '!');
      }
      return;
    }

    /* Admin Delete lead */
    var delBtn = e.target.closest('[data-adm-del]');
    if(delBtn){
      var dId = delBtn.dataset.admDel;
      var foundLead = ADM.leads.find(function(l){ return l.id === dId; });
      var cName = foundLead && foundLead.clientName ? foundLead.clientName : 'este orçamento';
      showConfirmModal({
        title: 'Excluir Orçamento',
        message: 'Deseja realmente excluir o orçamento de <strong>"' + esc(cName) + '"</strong>?<br><span style="font-size:.82rem;color:var(--muted);display:block;margin-top:6px">Esta ação removerá o registro permanentemente.</span>',
        confirmText: 'Sim, Excluir',
        iconType: 'trash',
        onConfirm: function(){
          try {
            var localLeads = JSON.parse(localStorage.getItem('wm_client_leads') || '[]');
            if(Array.isArray(localLeads)){
              localLeads = localLeads.filter(function(l){ return l.id !== dId; });
              localStorage.setItem('wm_client_leads', JSON.stringify(localLeads));
            }
          } catch(err){}
          fetch('/api/leads/' + dId, { method: 'DELETE' }).catch(function(){});
          ADM.leads = ADM.leads.filter(function(l){ return l.id !== dId; });
          showToast('Orçamento excluído com sucesso.');
          openSheet('admin', { preserveScroll: true });
        }
      });
      return;
    }

    /* Admin Add Package (Adiciona no início como primeiro) */
    if(e.target.closest('[data-adm-act="add-pkg"]')){
      syncEditingPkgsFromDom();
      var newPkgId = 'pkg_' + Date.now();
      ADM.editingPkgs.unshift({
        id: newPkgId,
        name: 'Novo Pacote',
        price: 2500,
        short: 'Até 7h de cobertura · Fotografia',
        tag: 'Novo',
        inc: [],
        items: ['Até 7h de cobertura', '1 fotógrafo', 'Fotos editadas', 'Galeria online']
      });
      openSheet('admin', { focusSelector: '[data-pkg-field="name"][data-pkg-idx="0"]' });
      showToast('Novo pacote adicionado no início da lista.');
      return;
    }

    /* Admin Delete Package */
    var delPkgBtn = e.target.closest('[data-adm-act="del-pkg"]');
    if(delPkgBtn){
      syncEditingPkgsFromDom();
      var pIdx = parseInt(delPkgBtn.dataset.pkgIdx, 10);
      if(ADM.editingPkgs.length <= 1){
        showToast('⚠️ É necessário manter ao menos 1 pacote no catálogo.', 3500);
        return;
      }
      var targetPkg = ADM.editingPkgs[pIdx];
      if(!targetPkg) return;
      var pName = targetPkg.name || 'Pacote';

      showConfirmModal({
        title: 'Excluir Pacote',
        message: 'Deseja excluir o pacote <strong>"' + esc(pName) + '"</strong>?<br><span style="font-size:.82rem;color:var(--muted);display:block;margin-top:6px">O pacote será removido da lista. Clique em "Salvar Alterações no Catálogo" ao terminar para publicar no site.</span>',
        confirmText: 'Sim, Excluir Pacote',
        iconType: 'trash',
        onConfirm: function(){
          ADM.editingPkgs.splice(pIdx, 1);
          openSheet('admin', { preserveScroll: true });
          showToast('🗑️ Pacote "' + pName + '" excluído! Lembre-se de salvar.', 3500);
        }
      });
      return;
    }

    /* Admin Add Extra (Adiciona no início do grupo) */
    var addExBtn = e.target.closest('[data-adm-act="add-extra"]');
    if(addExBtn){
      syncEditingPkgsFromDom();
      var grp = addExBtn.dataset.extraGroup || 'media';
      var newExId = (grp==='album' ? 'al_' : 'ex_') + Date.now();
      var newExtraObj = {
        id: newExId,
        g: grp,
        name: grp === 'album' ? 'Novo Álbum' : 'Novo Serviço',
        desc: grp === 'album' ? '25x50 cm · 40 páginas · até 80 fotos' : 'Descrição do serviço extra',
        price: 500
      };
      var targetIdx = ADM.editingExtras.findIndex(function(x){ return x.g === grp; });
      if(targetIdx === -1){
        ADM.editingExtras.unshift(newExtraObj);
        targetIdx = 0;
      } else {
        ADM.editingExtras.splice(targetIdx, 0, newExtraObj);
      }
      openSheet('admin', { focusSelector: '[data-ex-field="name"][data-ex-idx="'+targetIdx+'"]' });
      showToast((grp === 'album' ? 'Novo álbum' : 'Novo serviço') + ' adicionado no topo da seção.');
      return;
    }

    /* Admin Delete Extra */
    var delExBtn = e.target.closest('[data-adm-act="del-extra"]');
    if(delExBtn){
      syncEditingPkgsFromDom();
      var eIdx = parseInt(delExBtn.dataset.exIdx, 10);
      var targetEx = ADM.editingExtras[eIdx];
      if(!targetEx) return;
      var exName = targetEx.name || 'Item';
      var isAlbum = targetEx.g === 'album';

      showConfirmModal({
        title: isAlbum ? 'Excluir Álbum' : 'Excluir Serviço',
        message: 'Deseja excluir ' + (isAlbum ? 'o álbum' : 'o serviço') + ' <strong>"' + esc(exName) + '"</strong>?<br><span style="font-size:.82rem;color:var(--muted);display:block;margin-top:6px">O item será removido da lista. Clique em "Salvar Alterações no Catálogo" para confirmar.</span>',
        confirmText: 'Sim, Excluir',
        iconType: 'trash',
        onConfirm: function(){
          ADM.editingExtras.splice(eIdx, 1);
          openSheet('admin', { preserveScroll: true });
          showToast('🗑️ Item "' + exName + '" excluído! Lembre-se de salvar.', 3500);
        }
      });
      return;
    }

    /* Admin Save Config */
    if(e.target.closest('[data-adm-act="save-config"]')){
      syncEditingPkgsFromDom();
      var saveBtn = $('#admSaveBtn');
      if(saveBtn){
        saveBtn.innerHTML = '⏳ Salvando alterações...';
      }

      PKGS = JSON.parse(JSON.stringify(ADM.editingPkgs));
      EXTRAS = JSON.parse(JSON.stringify(ADM.editingExtras));
      ALBUMS3 = EXTRAS.filter(function(x){ return x.g === 'album'; }).map(function(x){ return x.id; });

      // Salva no localStorage imediatamente para refletir na página inicial
      try {
        localStorage.setItem('wm_catalog_config', JSON.stringify({
          packages: PKGS,
          extras: EXTRAS,
          updatedAt: new Date().toISOString()
        }));
      } catch(err){ console.warn('Erro ao salvar catálogo no localStorage:', err); }

      // Atualiza a tela de catálogo por trás (página inicial / etapas) imediatamente!
      if(S.pkg && !PKGS.some(function(p){ return p.id === S.pkg; })){
        S.pkg = (PKGS[0] ? PKGS[0].id : null);
      }
      render(false);

      // Salva no backend
      fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ packages: PKGS, extras: EXTRAS })
      })
      .then(function(r){ return r.json(); })
      .then(function(res){
        openSheet('admin', { preserveScroll: true });
        var alertEl = $('#admSaveAlert');
        if(alertEl){
          alertEl.style.display = 'flex';
          setTimeout(function(){ if(alertEl) alertEl.style.display = 'none'; }, 5000);
        }
        var btnSaved = $('#admSaveBtn');
        if(btnSaved){
          btnSaved.innerHTML = '✅ Salvo com sucesso!';
          btnSaved.style.background = '#2e7d32';
          btnSaved.style.borderColor = '#2e7d32';
          setTimeout(function(){
            if(btnSaved){
              btnSaved.innerHTML = '💾 Salvar Alterações no Catálogo';
              btnSaved.style.background = '';
              btnSaved.style.borderColor = '';
            }
          }, 3000);
        }
        showToast('✅ Catálogo salvo! Alterações ativas na página inicial.');
      })
      .catch(function(err){
        console.warn('Erro ao salvar no servidor:', err);
        openSheet('admin', { preserveScroll: true });
        showToast('✅ Alterações salvas localmente no catálogo!');
      });
      return;
    }

    /* Admin Reset Config */
    if(e.target.closest('[data-adm-act="reset-config"]')){
      showConfirmModal({
        title: 'Restaurar Catálogo Original',
        message: 'Deseja realmente restaurar os pacotes e adicionais para o padrão de fábrica?<br><span style="font-size:.82rem;color:var(--muted);display:block;margin-top:6px">Todas as personalizações de preços e nomes atuais serão redefinidas.</span>',
        confirmText: 'Restaurar Padrão',
        iconType: 'warning',
        confirmClass: 'warning',
        onConfirm: function(){
          PKGS = JSON.parse(JSON.stringify(DEFAULT_PKGS));
          EXTRAS = JSON.parse(JSON.stringify(DEFAULT_EXTRAS));
          ALBUMS3 = ['al_essencial','al_premium','al_luxo'];
          ADM.editingPkgs = JSON.parse(JSON.stringify(DEFAULT_PKGS));
          ADM.editingExtras = JSON.parse(JSON.stringify(DEFAULT_EXTRAS));

          try {
            localStorage.removeItem('wm_catalog_config');
          } catch(e){}

          if(S.pkg && !PKGS.some(function(p){ return p.id === S.pkg; })){
            S.pkg = PKGS[0] ? PKGS[0].id : null;
          }
          render(false);

          fetch('/api/config/reset', { method: 'POST' }).catch(function(){});

          openSheet('admin', { preserveScroll: true });
          showToast('Catálogo restaurado para o padrão original.');
        }
      });
      return;
    }
  });

  /* Suporte para Arrastar e Soltar (Drag and Drop) */
  var draggedItem = null;

  sheet.addEventListener('dragstart', function(e){
    var card = e.target.closest('.adm-item-card');
    if(!card) return;
    var type = card.dataset.dragType;
    var idx = parseInt(card.dataset.dragIdx, 10);
    var group = card.dataset.dragGroup || '';
    draggedItem = { type: type, idx: idx, group: group };
    card.classList.add('dragging');
    if(e.dataTransfer){
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(idx));
    }
  });

  sheet.addEventListener('dragover', function(e){
    if(!draggedItem) return;
    var card = e.target.closest('.adm-item-card');
    if(!card) return;
    if(card.dataset.dragType === draggedItem.type && (!draggedItem.group || card.dataset.dragGroup === draggedItem.group)){
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    }
  });

  sheet.addEventListener('dragleave', function(e){
    var card = e.target.closest('.adm-item-card');
    if(card) card.classList.remove('drag-over');
  });

  sheet.addEventListener('drop', function(e){
    if(!draggedItem) return;
    var card = e.target.closest('.adm-item-card');
    if(!card) return;
    card.classList.remove('drag-over');
    if(card.dataset.dragType !== draggedItem.type) return;
    if(draggedItem.group && card.dataset.dragGroup !== draggedItem.group) return;
    e.preventDefault();

    var targetIdx = parseInt(card.dataset.dragIdx, 10);
    var srcIdx = draggedItem.idx;
    if(targetIdx !== srcIdx){
      syncEditingPkgsFromDom();
      if(draggedItem.type === 'pkg'){
        var moved = ADM.editingPkgs.splice(srcIdx, 1)[0];
        ADM.editingPkgs.splice(targetIdx, 0, moved);
      } else {
        var moved = ADM.editingExtras.splice(srcIdx, 1)[0];
        ADM.editingExtras.splice(targetIdx, 0, moved);
      }
      openSheet('admin', { preserveScroll: true });
      showToast('Ordem reorganizada! Lembre-se de salvar ao terminar.');
    }
    draggedItem = null;
  });

  sheet.addEventListener('dragend', function(){
    document.querySelectorAll('.adm-item-card.dragging, .adm-item-card.drag-over').forEach(function(el){
      el.classList.remove('dragging','drag-over');
    });
    draggedItem = null;
  });

  /* Listeners do Modal de Confirmação In-App */
  document.addEventListener('click', function(e){
    if(e.target.closest('#appConfirmCancel') || (e.target && e.target.id === 'appConfirmBackdrop')){
      closeConfirmModal();
      return;
    }
    if(e.target.closest('#appConfirmAction')){
      var cb = pendingConfirmAction;
      closeConfirmModal();
      if(typeof cb === 'function') cb();
      return;
    }
  });

  document.addEventListener('keydown', function(e){
    var m = $('#appConfirmModal');
    if(m && m.style.display !== 'none'){
      if(e.key === 'Escape'){
        closeConfirmModal();
        e.stopPropagation();
        return;
      }
      if(e.key === 'Enter'){
        var cb = pendingConfirmAction;
        closeConfirmModal();
        if(typeof cb === 'function') cb();
        e.stopPropagation();
        return;
      }
    }
    if(e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  loadConfig();
  render(false);
})();
</script>

</body></html>
